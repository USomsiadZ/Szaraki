<html>

<head>
    <style>
        body {
            background: #303030;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .ball {
            width: 150px;
            height: 150px;
            background-color: silver;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            /* flex poziome wyśrodkowanie */
            align-items: center;
            /* flex wyśrodkowanie tekstu pion*/
            z-index: 5;
        }

        .ball:hover {
            background-color: #7e7e7e;
            cursor: pointer;
        }

        .small-ball {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: rgb(170, 170, 170);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* transform: translate(15px, 100px); */
            transition: transform 2s ease;
            /* czas animacji */
        }

        .small-ball:hover,
        .ball:hover {
            background-color: #7e7e7e;
            cursor: pointer;
        }
    </style>
    <script>
        /*   https://www.w3schools.com/js/js_events_load.asp   */
        /*   https://www.w3schools.com/jsref/met_win_settimeout.asp   */
        tab = ["un", "happy", "ness"];
        n = tab.length;
        document.addEventListener("DOMContentLoaded", function () {
            for (let i = 0; i < n; i++) {
                const smallBall = document.createElement("p");
                smallBall.classList.add("small-ball");
                smallBall.id = `ball${i + 1}`;
                smallBall.innerHTML = tab[i];
                document.body.appendChild(smallBall);
            }



            setTimeout(() => {
                for (let i = 0; i < n; i++) {
                    ball = document.getElementById(`ball${i + 1}`);
                    angle = (i / n) * Math.PI * 2;
                    // cos - x
                    // sin - y
                    // 100 - dalekość
                    // x = r*cos(angle)
                    // y = r*sin(angle)
                    ball.style.transform = `translate(${Math.cos(angle) * 200}px, ${Math.sin(angle) * 200}px)`;
                }
            }, 300);
        });
    </script>
</head>

<body>
    <p class="ball">unhappiness</p>

</body>

</html>
