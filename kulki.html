<html>

<head>
    <style>
        body {
            background: #081420;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .ball {
            width: 100px;
            height: 100px;
            background-color: silver;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            /* flex poziome wyśrodkowanie */
            align-items: center;
            /* flex wyśrodkowanie tekstu pion*/
        }

        .small-ball {
            width: 100px;
            height: 100px;
            background-color: silver;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* transform: translate(15px, 100px); */
            transition: transform 2s ease;
            /* czas animacji */
        }
    </style>
    <script>
        /*   https://www.w3schools.com/js/js_events_load.asp   */
        /*   https://www.w3schools.com/jsref/met_win_settimeout.asp   */
        document.addEventListener("DOMContentLoaded", function () {
            for (let i = 0; i < 6; i++) {
                const smallBall = document.createElement("p");
                smallBall.classList.add("small-ball");
                smallBall.id = `ball${i + 1}`;
                document.body.appendChild(smallBall);
            }

            setTimeout(() => {
                for (let i = 0; i < 6; i++) {
                    ball = document.getElementById(`ball${i + 1}`);
                    angle = (i / 6) * 360;
                    // cos - x
                    // sin - y
                    // 100 - dalekość
                    ball.style.transform = `translate(${Math.cos(angle) * 100}px, ${Math.sin(angle) * 100}px)`;
                }
            }, 300);
        });
    </script>
</head>

<body>
    <p class="ball">kulka</p>

</body>

</html>
